<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body mb-4" data-bs-theme="dark">
        <div class="container-fluid">
          <a class="navbar-brand fw-bold" href="index.html">⚽ Football Leagues</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTogglerDemo03"
            aria-controls="navbarTogglerDemo03" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
    
          <div class="collapse navbar-collapse" id="navbarTogglerDemo03">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="index.html">Home</a> 
              </li>
            </ul>
          </div>
        </div>
      </nav>

    <div class="container">
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="col-lg-8">
                    <h4 class="mb-3 text-secondary fw-bold">Cadastro</h4>
                    <div id="listaCards" class="row row-cols-1 row-cols-md-2 g-3">
                    </div>
                </div>
                <div class="card shadow-sm border-0 p-4">
                    <h4 class="mb-3 text-secondary fw-bold">Novo Usuario</h4>
                    <form id="formFuncionario">
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome Completo</label>
                            <input type="text" class="form-control" id="nome" required placeholder="Ex: Joao Silva">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" class="form-control" id="email" required
                                placeholder="Ex: joao@empresa.com">
                        </div>
                        <div class="mb-3">
                            <label for="senha" class="form-label">Senha de Acesso</label>
                            <input type="password" class="form-control" id="senha" required
                                placeholder="Digite uma senha">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Cadastrar-se</button>
                        <div>
                          <ul>Nao possui uma conta ?<a class="nav-link active" aria-current="page" href="cadastro_usuario.html">Criar</a></ul>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
