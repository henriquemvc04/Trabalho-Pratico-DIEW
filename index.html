<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Football Leagues</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <style>
    .carousel-img {
      height: 500px;
      object-fit: cover;
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->

  <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body mb-4" data-bs-theme="dark">

    <div class="container-fluid">

      <a class="navbar-brand" href="#">Football Leagues</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTogglerDemo03"
        aria-controls="navbarTogglerDemo03" aria-expanded="false" aria-label="Toggle navigation">

        <span class="navbar-toggler-icon"></span>

      </button>

      <div class="collapse navbar-collapse" id="navbarTogglerDemo03">

        <ul class="navbar-nav me-auto mb-2 mb-lg-0">

          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">
              Home
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#">
              Leagues
            </a>
          </li>

        </ul>

        <form class="d-flex" role="search">

          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">

          <button class="btn btn-outline-success" type="submit">
            Search
          </button>

        </form>

      </div>

    </div>

  </nav>

  <!-- CAROUSEL -->

  <header>

    <div id="carouselExampleCaptions" class="carousel slide">

      <!-- INDICATORS -->

      <div class="carousel-indicators">

        <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active"
          aria-current="true" aria-label="Slide 1">
        </button>

        <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1" aria-label="Slide 2">
        </button>

        <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2" aria-label="Slide 3">
        </button>

        <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="3" aria-label="Slide 4">
        </button>

        <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="4" aria-label="Slide 5">
        </button>

      </div>

      <!-- SLIDES -->

      <div class="carousel-inner">

        <!-- PREMIER LEAGUE -->

        <div class="carousel-item active">

          <img src="imgsLigas/PremierLeague.jpg" class="d-block w-100 carousel-img" alt="Premier League">

          <div class="carousel-caption d-none d-md-block">

            <h5>Premier League</h5>

            <p>Principal liga da Inglaterra.</p>

          </div>

        </div>

        <!-- LA LIGA -->

        <div class="carousel-item">

          <img src="imgsLigas/LaLiga.jpg" class="d-block w-100 carousel-img" alt="La Liga">

          <div class="carousel-caption d-none d-md-block">

            <h5>La Liga</h5>

            <p>Principal liga da Espanha.</p>

          </div>

        </div>

        <!-- SERIE A -->

        <div class="carousel-item">

          <img src="imgsLigas/SerieA.jpg" class="d-block w-100 carousel-img" alt="Serie A">

          <div class="carousel-caption d-none d-md-block">

            <h5>Serie A</h5>

            <p>Principal liga da Itália.</p>

          </div>

        </div>

        <!-- BUNDESLIGA -->

        <div class="carousel-item">

          <img src="imgsLigas/Bundesliga.jpg" class="d-block w-100 carousel-img" alt="Bundesliga">

          <div class="carousel-caption d-none d-md-block">

            <h5>Bundesliga</h5>

            <p>Principal liga da Alemanha.</p>

          </div>

        </div>

        <!-- BRASILEIRÃO -->

        <div class="carousel-item">

          <img src="imgsLigas/Brasileirao.jpg" class="d-block w-100 carousel-img" alt="Brasileirão">

          <div class="carousel-caption d-none d-md-block">

            <h5>Brasileirão</h5>

            <p>Principal liga do Brasil.</p>

          </div>

        </div>

      </div>

      <!-- CONTROLS -->

      <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions"
        data-bs-slide="prev">

        <span class="carousel-control-prev-icon" aria-hidden="true"></span>

        <span class="visually-hidden">
          Previous
        </span>

      </button>

      <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions"
        data-bs-slide="next">

        <span class="carousel-control-next-icon" aria-hidden="true"></span>

        <span class="visually-hidden">
          Next
        </span>

      </button>

    </div>

  </header>

  <script src="index.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>

</body>

</html>
